<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>KrinkerLabs BreakWall</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="app">
  <header class="top">
    <h1 class="mark" aria-label="KrinkerLabs BreakWall">KRINKER<span class="labs">LABS</span><sup class="tm">™</sup><i class="dot" aria-hidden="true"></i><span class="product">BREAKWALL</span><span class="beta" data-title="beta">BETA</span></h1>
  </header>

  <section class="hud panel" aria-label="Score and lives">
    <p class="stat"><span class="label" data-text="score">Score</span> <b id="score" aria-live="off">0</b></p>
    <p class="stat"><span class="label" data-text="lives">Lives</span> <b id="lives" class="lives">3</b></p>
    <div class="buttons">
      <button type="button" class="pill" id="pause">Pause</button>
      <button type="button" class="pill" id="sound" aria-pressed="true">Sound: on</button>
    </div>
  </section>

  <main id="stage">
    <canvas id="field" aria-label="Playing field"></canvas>
    <div class="message panel" id="message" role="status" aria-live="polite" hidden>
      <p class="message-title" id="messageTitle"></p>
      <p class="message-line" id="messageLine"></p>
      <button type="button" class="go" id="again" data-text="again" hidden>Play again</button>
    </div>
  </main>

  <footer class="bottom">
    <nav class="links">
      <a class="pill" href="https://krinkerlabs.com" data-text="back">Back to krinkerlabs.com</a>
      <a class="linkish" href="https://krinkerlabs.com/en/contact/?topic=breakwall" target="_blank" rel="noopener" data-text="bug">Found a bug? Tell us</a>
    </nav>
    <p class="legal" data-text="legal"></p>
  </footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
